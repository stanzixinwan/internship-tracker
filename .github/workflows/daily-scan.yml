name: Daily Internship Scan

on:
  schedule:
    # 13:00 UTC ≈ 21:00 Beijing/Shanghai time, 9:00am US Eastern.
    # Cron is always UTC -- adjust the hour to taste.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: ${{ secrets.SHEET_TAB }}
        run: python fetch_internships.py
